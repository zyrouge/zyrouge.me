name: Lint

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v6
              with:
                  node-version: lts
                  cache: npm

            - name: 🏗️  Prerequisites
              run: npm install --ci

            - name: 🚨 Lint
              run: npm run lint
